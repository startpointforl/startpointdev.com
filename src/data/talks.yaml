- id: holyjs-2026
  title: "Добро пожаловать на сервер: где в Next.js App Router прячутся уязвимости"
  titleEn: "Welcome to the server: where vulnerabilities hide in Next.js App Router"
  event: HolyJS 2026 Autumn
  date: 2026-10-23
  city: Санкт-Петербург
  cityEn: Saint Petersburg
  format: offline
  page: https://holyjs.ru/talks/20011224-welcome-to-the-server-where-vulnerabilities-hide-in-next-js-app-router/
  abstract: >-
    В декабре 2025-го в React и Next.js обнаружилась серия критических уязвимостей. Обновления вышли
    оперативно, и проблема была локализована. Но для тех, кто работает с App Router, этот инцидент — повод
    заглянуть глубже и спросить: какие архитектурные решения сделали это возможным?
    Разберём архитектуру App Router изнутри: как работает React Flight Protocol, как на этапе бандлинга
    разделяется серверный и клиентский граф компонентов, что сервер принимает, чему доверяет и что исполняет.
    Найдём конкретное место в архитектуре, где жила уязвимость, и поймём, почему она там оказалась.

- id: podlodka-react-crew-4
  title: "Работа с данными в React: взгляд изнутри V8"
  titleEn: "Working with data in React: a view from inside V8"
  event: Podlodka React Crew #4
  date: 2026-03-18
  format: online
  video: https://www.youtube.com/live/3LM9AekBuaw
  note: Открытая сессия
  noteEn: Open session
  abstract: >-
    В React мы думаем о данных в терминах state, props и ответов от API. V8 думает о них в совершенно других
    терминах — и именно его точка зрения определяет, насколько быстро работает приложение. Разберём, как V8
    запоминает структуру данных через hidden classes и inline caches, и почему один код в React даёт движку
    разогнаться, а другой — постоянно сбивает с толку.

- id: dump-spb-2026
  title: "Ignition, Sparkplug, Maglev, TurboFan: как компилирует V8"
  titleEn: "Ignition, Sparkplug, Maglev, TurboFan: how V8 compiles"
  event: DUMP Санкт-Петербург
  eventEn: DUMP Saint Petersburg
  date: 2026-02-13
  city: Санкт-Петербург
  cityEn: Saint Petersburg
  format: offline
  video: https://youtu.be/jY7Af6zR40A
  abstract: >-
    Современный V8 — это сложный конвейер из нескольких компиляторов. Если раньше всё работало на Ignition
    и TurboFan, то сегодня к ним добавились Sparkplug и Maglev. Как V8 решает, когда и какой компилятор
    использовать? Какие подходы к оптимизации применяет каждый из них? И как разработчику заглянуть в этот
    процесс на практике?

- id: frontendconf-2025
  title: "Node.js на стероидах: как и зачем писать нативные модули"
  titleEn: "Node.js on steroids: how and why to write native addons"
  event: FrontendConf 2025
  date: 2025-10-21
  city: Москва
  cityEn: Moscow
  format: offline
  video: https://youtu.be/ZaoRJs5HD8k
  page: https://frontendconf.ru/moscow/2025/abstracts/15502
  abstract: >-
    Node.js умеет многое, но не всё. Когда нужно выжать максимум из вычислений или достучаться до «железа»,
    на сцену выходят нативные модули. Node-gyp — не самая популярная технология, но именно она позволяет
    быстро подключить мощь C++ к Node.js и заметно ускорить приложение. Соберём модуль на C++ с нуля, замерим
    производительность, разберём альтернативы и честно обсудим, когда node-gyp — суперсила, а когда — лишняя сложность.
  note: 4 место в рейтинге докладов конференции
  noteEn: "#4 in the conference talk rating"

- id: ya-subbotnik-2025
  title: "Не переписывай — обнови! Как вдохнуть жизнь в легаси"
  titleEn: "Don't rewrite — upgrade! Breathing new life into legacy"
  event: Яндекс Субботник
  eventEn: Yandex Subbotnik
  date: 2025-07-26
  city: Минск
  cityEn: Minsk
  format: offline
  video: https://youtu.be/a1qoD9jdJa0
  abstract: >-
    Когда проекту много лет, технологии устарели, а на горизонте — крупные продуктовые задачи, возникает
    соблазн всё переписать. Но что, если времени и ресурсов нет? История поэтапного техноапгрейда фронтенда:
    от Webpack 4 и классовых компонентов до Vite и Redux Toolkit. Разберёмся, как декомпозировать обновление,
    не блокируя прод, как убедить команду и что делать, когда package.json давно потерял актуальность.

- id: minskjs-2025
  title: "gyp ERR! Почему падает npm install?"
  titleEn: "gyp ERR! Why does npm install fail?"
  event: MinskJS
  date: 2025-03-19
  format: online
  video: https://youtu.be/fYRw6QFXkqw
  note: Митап MinskJS №12
  abstract: >-
    Вы когда-нибудь видели в терминале gyp ERR! после npm install? Если да, то наверняка
    думали «Что за чертовщина?», «Почему опять?» и «Я просто хотел установить пакет!».
    Расскажу, что такое node-gyp, зачем он нужен и почему установка пакетов в Node.js иногда
    превращается в ад. Научимся разбираться в этих ошибках и чинить их, чтобы раз и навсегда
    перестать бояться gyp ERR!.

