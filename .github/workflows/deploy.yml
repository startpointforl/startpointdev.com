name: Deploy

on:
  push:
    branches: [main]
  # Каждый день статьи, у которых наступила дата, появляются в списках, поиске и RSS.
  # Время в UTC. На практике GitHub запускает расписание с опозданием на несколько часов
  # (в октябре 2026 — около 7 ч), поэтому стартуем сразу после полуночи UTC, а второй запуск — страховка.
  # Минуты не круглые: в начале часа у GitHub самая большая очередь.
  schedule:
    - cron: '17 0 * * *'
    - cron: '47 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
